letter-spacing<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jen Li — speculative fiction, essays, and nonfiction exploring science, technology, and consciousness.">
  <meta name="author" content="Jen Li">
  <title>Jen Li</title>
  <style>
:root {
  --ink: #111111;
  --muted: #777777;
  --rule: #dddddd;
  --paper: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f2efe8;
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}
main {
  width: min(760px, calc(100% - 48px));
  margin: 0 auto;
  padding: 112px 0 96px;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover {
  opacity: 0.55;
}
h1 {
  margin: 0 0 56px;
  font-size: clamp(2.8rem, 8vw, 4.6rem);
  line-height: 0.95;
  font-weight: normal;
  letter-spacing: -0.03em;
}
.manifesto {
  font-size: clamp(1.35rem, 3vw, 1.65rem);
  line-height: 1.85;
}
.manifesto p { margin: 0; }
.categories {
  margin-top: 112px;
  display: grid;
  gap: 22px;
}
.categories a {
  display: inline-block;
  width: fit-content;
  font-size: 1.28rem;
  letter-spacing: 0.02em;
  position: relative;
  transition: opacity 0.2s ease;
}
.categories a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -3px;
  width: 0;
  height: 1px;
  background: currentColor;
  transition: width 0.25s ease;
}

.categories a:hover::after {
  width: 100%;
}
.page-title {
  margin-bottom: 72px;
}
.page-title h1 {
  margin-bottom: 18px;
}
.back {
  color: var(--muted);
  font-size: 0.9rem;
}
article {
  margin-bottom: 48px;
}
article:last-child {
  margin-bottom: 0;
}
h2 {
  margin: 0;
  font-size: clamp(1.35rem, 3vw, 1.65rem);
  line-height: 1.25;
  font-weight: normal;
}
.pitch {
  max-width: 700px;
  margin: 18px 0 16px;
  font-size: 1.04rem;
  line-height: 1.75;
}
.status {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}
.status span { color: var(--ink); }
footer {
  margin-top: 112px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  color: #8a8a8a;
  font-size: 0.82rem;
}
@media (max-width: 600px) {
  main {
    width: min(100% - 32px, 760px);
    padding-top: 72px;
  }
  .categories { margin-top: 84px; }
}
</style>
</head>
<body>
  <main>
    <h1>Jen Li</h1>

    <div class="manifesto" aria-label="Themes">
      <p>Science.</p>
      <p>Technology.</p>
      <p>Strange Entanglements.</p>
      <p>Unruly Consciousness.</p>
      <p>Messy Lives.</p>
    </div>

    <nav class="categories" aria-label="Works">
      <a href="novels.html">Novels</a>
      <a href="short-fiction.html">Short Fiction</a>
      <a href="nonfiction.html">Nonfiction</a>
    </nav>

   <footer>
  <div>© Jen Li</div>
  <div style="margin-top: 12px;">
    <a href="mailto:hello@jenliwrites.com">hello@jenliwrites.com</a>
  </div>
</footer>
